<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SARSWATI PUJA SAMITI - BAGHAKOL | Official Portal</title>
<style>
:root{--bg:#f8f5ee;--card:#ffffff;--ink:#241e17;--muted:#6b6255;--line:#e4dcd0;--saffron:#b85c16;--gold:#d49b28;--gold-dark:#9e6f10;--green:#1b6e41;--red:#b83226;--nav:#1f1a14}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;overflow-x:hidden;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans Devanagari",system-ui,-apple-system,sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--saffron);color:white;font-weight:650;transition:all .15s ease;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active{transform:scale(0.98)}button:hover{opacity:.92}
button.secondary{background:#eae2d4;color:#3b3226}button.success{background:var(--green);color:white}button.danger{background:var(--red)}button.small{padding:6px 10px;font-size:12px;min-height:34px}
.app{display:flex;min-height:100vh}

/* Sidebar Responsive Styling */
.side{width:260px;background:var(--nav);color:#fff;padding:20px 14px;flex-shrink:0;display:flex;flex-direction:column;justify-content:space-between;box-shadow:4px 0 15px #0002}
.brand{padding:8px 6px 16px;border-bottom:1px solid #3d352b;text-align:center}
.brand-img{width:100%;max-width:200px;height:auto;border-radius:12px;border:2px solid var(--gold);box-shadow:0 4px 14px #0005}
.brand h2{font-size:16px;margin:10px 0 2px;color:#f3e9d9;line-height:1.3}.brand p{color:#bfae99;font-size:11px;margin:0}
.nav{margin-top:14px;display:grid;gap:3px}
.nav button{background:transparent;color:#d5cbbe;text-align:left;font-weight:500;padding:12px 14px;border-radius:9px;display:flex;align-items:center;gap:12px;font-size:14px;width:100%;min-height:46px}
.nav button.active,.nav button:hover{background:#3a3127;color:#fff;font-weight:600}
.nav button i{font-style:normal;font-size:19px;width:24px;text-align:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.sidefoot{font-size:11px;color:#9b8c7b;margin:15px 8px;text-align:center;border-top:1px solid #3d352b;padding-top:12px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{min-height:64px;padding-top:calc(8px + env(safe-area-inset-top, 0px));padding-bottom:8px;padding-left:16px;padding-right:16px;background:rgba(255,255,255,0.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px #00000010}
.top strong{font-size:clamp(15px, 4vw, 18px);color:#2c2317}.top small{color:var(--muted)}
.public-badge{background:#e8f4ec;color:var(--green);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.content{padding:clamp(14px, 4vw, 24px);padding-bottom:calc(65px + env(safe-area-inset-bottom, 0px));max-width:1400px;margin:0 auto;width:100%;box-sizing:border-box}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.pagehead h1{font-size:clamp(18px, 5vw, 24px);margin:0 0 3px;color:#2c2317}.pagehead p{color:var(--muted);margin:0;font-size:12.5px}

.banner-card{background:linear-gradient(135deg,#9c4309,#d4821a);color:#fff;border-radius:16px;padding:16px 20px;margin-bottom:20px;box-shadow:0 6px 20px #b85c1625;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.banner-card img{width:75px;height:75px;border-radius:12px;object-fit:cover;border:2px solid #ffe6a3;flex-shrink:0}
.banner-card h2{margin:0 0 4px;font-size:clamp(18px, 4.5vw, 22px)}.banner-card p{margin:0;opacity:.92;font-size:12.5px;line-height:1.4}

/* Responsive Grid System */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 10px #241e1708}
.stat label{color:var(--muted);font-size:12px;font-weight:600}.stat h2{font-size:clamp(20px, 6vw, 26px);margin:6px 0 2px;color:#2c2317}.stat small{color:var(--muted);font-size:11px}
.stat .ico{float:right;background:#fbf3e6;padding:8px 10px;border-radius:10px;font-size:22px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.sectiongrid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:14px}
.panel h3{font-size:15px;margin:0 0 12px;color:#33291d;display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--muted)}

/* Notice Card Styling */
.notice-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px rgba(36,30,23,0.06)}
.notice-card .notice-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px}
.notice-card h3{margin:0 0 6px;color:#b85c16;font-size:clamp(16px, 4.5vw, 19px)}
.notice-card p{margin:0 0 12px;font-size:13.5px;line-height:1.6;color:#3a3126;white-space:pre-wrap}
.notice-media-img{width:100%;max-height:400px;object-fit:cover;border-radius:12px;border:1px solid var(--line);margin:10px 0}
.notice-pdf-box{background:#fdf6e7;border:1px dashed var(--gold);border-radius:10px;padding:12px;display:flex;align-items:center;justify-content:space-between;margin:10px 0;gap:10px}

/* Touch-Friendly Tables with Pan Scroll */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;border-radius:10px;border:1px solid var(--line);margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:550px}
th{text-align:left;color:var(--muted);font-weight:600;background:#faf7f0;padding:11px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}tr:last-child td{border-bottom:0}
.empty{text-align:center;padding:26px;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{flex:1;min-width:180px}
.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:grid;gap:4px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#52483b;font-weight:650}
.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;border:1px solid #d8cfc2;border-radius:8px;padding:10px 11px;background:#fff;color:var(--ink);outline:none;font-size:13.5px;min-height:44px}
.field textarea{min-height:75px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}

/* Responsive Modal Dialog */
.modal{position:fixed;inset:0;background:#140f0aa3;display:none;align-items:center;justify-content:center;padding:12px;z-index:200;backdrop-filter:blur(2px)}
.modal.show{display:flex}.dialog{background:#fff;border-radius:16px;width:min(760px,96vw);max-height:92vh;overflow-y:auto;padding:20px;box-shadow:0 10px 30px #0004}
.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;position:sticky;top:0;background:#fff;z-index:5;padding-bottom:10px;border-bottom:1px solid var(--line)}
.dialoghead h2{font-size:17px;margin:0}
.close{background:#eae2d4;color:#333;padding:6px 12px;border-radius:8px;font-size:16px;min-height:36px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:20px;background:#e3f2fd;color:#0d47a1;font-size:11px;font-weight:600}
.pill.green{background:#e8f5e9;color:#1b5e20}.pill.orange{background:#fff3e0;color:#e65100}.pill.red{background:#ffebee;color:#b71c1c}
.progress{height:9px;background:#eae2d4;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:var(--gold)}

/* ROYAL HERITAGE ULTRA-PROFESSIONAL CERTIFICATE STYLING */
.cert-preview-container{width:100%;overflow-x:auto;padding:6px}
.cert-preview{background:linear-gradient(135deg,#fffdf8 0%,#fdf6e7 100%);border:12px double #c4922f;outline:2px solid #8f3d04;outline-offset:-8px;padding:clamp(20px, 6vw, 36px);text-align:center;color:#3a2914;position:relative;margin:auto;box-shadow:0 10px 35px rgba(0,0,0,0.18);min-width:320px;border-radius:6px}
.cert-preview .header-logo{width:clamp(85px, 20vw, 115px);height:clamp(85px, 20vw, 115px);border-radius:50%;border:4px solid #c4922f;margin:0 auto 10px;object-fit:cover;box-shadow:0 6px 16px rgba(184,92,22,0.25)}
.cert-preview h2{font-size:clamp(20px, 5.5vw, 28px);color:#a8540c;margin:4px 0 2px;font-family:"Noto Sans Devanagari",serif;font-weight:800;letter-spacing:0.5px}
.cert-preview .location{font-size:clamp(12px, 3.5vw, 14.5px);color:#664d26;font-weight:700;letter-spacing:0.8px;margin-bottom:12px}
.cert-preview .divider{height:3px;background:linear-gradient(90deg,transparent,#c4922f,#8f3d04,#c4922f,transparent);margin:12px auto;width:90%;border-radius:2px}
.cert-preview .cert-subtitle{font-size:clamp(12px, 3.2vw, 14px);letter-spacing:2px;color:#8a601e;text-transform:uppercase;font-weight:800}
.cert-preview .certtitle{font-size:clamp(22px, 6.5vw, 32px);color:#8f3d04;margin:12px 0;font-weight:800;text-decoration:underline;text-decoration-color:#e0b253;text-underline-offset:6px;font-family:"Noto Sans Devanagari",serif}
.cert-preview .blessing{font-size:clamp(13px, 3.5vw, 14.5px);line-height:1.8;color:#4a381d;margin:12px 0}
.cert-preview .donor-box{background:#fff8eb;border:1.5px dashed #d9a236;border-radius:12px;padding:16px;margin:16px auto;max-width:580px;text-align:left;font-size:clamp(13.5px, 4vw, 15.5px);line-height:2.0;box-shadow:inset 0 0 10px rgba(196,146,47,0.08)}
.cert-preview .verification-seal{display:inline-flex;align-items:center;gap:6px;background:#e8f5e9;border:1.5px solid #81c784;color:#1b5e20;padding:6px 14px;border-radius:25px;font-size:11.5px;font-weight:700;margin:10px 0;box-shadow:0 2px 8px rgba(27,94,32,0.12)}
.cert-preview .signrow{display:flex;justify-content:space-between;margin-top:30px;font-size:clamp(11px, 3.2vw, 13px);color:#44341e}
.cert-preview .signrow div{text-align:center;width:31%}

/* AI Chat Styling */
.ai-card{background:linear-gradient(135deg,#1f1a14,#3b2d1d);color:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 8px 25px #0003}
.ai-card h2{color:#f5d796;margin:0 0 6px;font-size:20px;display:flex;align-items:center;gap:8px}
.ai-chat-box{background:#2a231b;border:1px solid #4a3d2e;border-radius:12px;padding:14px;max-height:350px;overflow-y:auto;margin:12px 0;display:flex;flex-direction:column;gap:10px}
.chat-msg{padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.6;max-width:85%}
.chat-msg.user{background:#b85c16;color:#fff;align-self:flex-end;border-bottom-right-radius:2px}
.chat-msg.ai{background:#3d3327;color:#f3e8d7;align-self:flex-start;border-bottom-left-radius:2px;border:1px solid #574836}

/* Backdrop Overlay for Mobile Drawer */
.sidebar-overlay{display:none;position:fixed;inset:0;background:#0006;z-index:80;backdrop-filter:blur(1px)}
.sidebar-overlay.show{display:block}

.hide{display:none!important}.mobilemenu{display:none}

/* Media Queries */
@media(max-width:960px){
 .side{width:230px}
 .sectiongrid{grid-template-columns:1fr}
 .grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:720px){
 .side{position:fixed;left:-280px;top:0;bottom:0;z-index:95;transition:left .25s ease-in-out}
 .side.open{left:0}
 .mobilemenu{display:inline-flex;padding:6px 10px;min-height:40px;font-size:20px}
 .top{padding-left:12px;padding-right:12px}
 .content{padding:12px;padding-bottom:calc(60px + env(safe-area-inset-bottom, 0px))}
 .grid{grid-template-columns:1fr 1fr;gap:10px}
 .fieldgrid{grid-template-columns:1fr}
 .banner-card{padding:14px;gap:12px}
 .banner-card img{width:60px;height:60px}
 .actions button{width:100%}
}

@media(max-width:420px){
 .grid{grid-template-columns:1fr}
 .top strong{max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}

@media print{
 body{background:white}.side,.top,.content > :not(#view),.modal .dialoghead,.no-print,.sidebar-overlay{display:none!important}
 .modal{display:block!important;position:static;background:white;padding:0}.dialog{display:block;box-shadow:none;padding:0;width:100%}
 .cert-preview{display:block!important;border:10px double #c4922f;padding:18mm 10mm;page-break-inside:avoid}
 @page{size:A4 portrait;margin:8mm}
}
</style>
</head>

<script>
// Supabase organization and isolated client-side caches.
const MAIN_ORG_ID = '2cd73205-da29-4844-a67e-76dca9bce645';
const ADMIN_CACHE_KEY = 'devi_mandir_admin_cache_v21';
const PUBLIC_CACHE_KEY = 'devi_mandir_public_cache_v21';
const LEGACY_CACHE_KEY = 'devi_mandir_master_cache_v20';
const MY_SUBMISSIONS_KEY = 'devi_mandir_my_submissions_v11';
const DEFAULT_DB = Object.freeze({
 donations: [], expenses: [], works: [], members: [], meetings: [], certificates: [], notices: [],
 settings: { temple: 'देवी मंदिर निर्माण समिति', place: 'बाघाकोल (बेला बिगहा)', president: '', secretary: '', treasurer: '', phone: '', address: '', goal: 500000, adminEmails: [] }
});
const emptyDb = () => JSON.parse(JSON.stringify(DEFAULT_DB));
let db = emptyDb();
let cloud = null, currentUser = null;
let isPublicMode = true, userRole = 'public';
let pendingSubmissions = [];
let cloudSaveInProgress = false;

function isAdminSession() { return !!currentUser && !isPublicMode && userRole === 'admin'; }
function requireAdminAction() {
 if (!isAdminSession()) { alert('यह कार्य केवल Supabase में अधिकृत समिति एडमिन कर सकता है।'); return false; }
 return true;
}
function loadLocalCache() {
 const key = isPublicMode ? PUBLIC_CACHE_KEY : ADMIN_CACHE_KEY;
 try {
  const raw = localStorage.getItem(key);
  db = raw ? { ...emptyDb(), ...JSON.parse(raw) } : emptyDb();
 } catch (e) { db = emptyDb(); }
}
function resetPublicMemory() {
 db = emptyDb();
 pendingSubmissions = [];
 try { localStorage.removeItem(ADMIN_CACHE_KEY); localStorage.removeItem(LEGACY_CACHE_KEY); } catch (e) {}
 loadLocalCache();
}

const titles = {
 dashboard: 'डैशबोर्ड', donations: 'चंदा / दान रजिस्टर', certificates: 'आभार प्रमाणपत्र',
 expenses: 'खर्च एवं भुगतान', construction: 'निर्माण कार्य प्रगति', committee: 'समिति सदस्य',
 meetings: 'बैठक रिकॉर्ड', community: '📢 समुदाय व सूचनाएं', aiAnalytics: '🤖 AI एनालिटिक्स', reports: 'रिपोर्ट व बैकअप', settings: 'मंदिर सेटिंग'
};

const money = n => '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const today = () => new Date().toISOString().slice(0, 10);
const fmt = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('hi-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const safe = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const id = prefix => prefix + '-' + Date.now().toString().slice(-7);

const total = (arr, key) => (arr || []).reduce((s, x) => s + Number(x[key] || 0), 0);

  'इक्कीस', 'बाईस', 'तेईस', 'चौबीस', 'पच्चीस', 'छब्बीस', 'सत्ताईस', 'अट्ठाईस', 'उनतीस', 'तीस',
  'इकतीस', 'बत्तीस', 'तैंतीस', 'चौंतीस', 'पैंतीस', 'छत्तीस', 'सैंतीस', 'अड़तीस', 'उनतालीस', 'चालिस',
  'इकतालीस', 'बयालीस', 'तैंतालीस', 'चौंतालीस', 'पैंतालीस', 'छियालीस', 'सैंतालीस', 'अड़तालीस', 'उंचास', 'पचास',
  'इक्यावन', 'बावन', 'तिर्पन', 'चौवन', 'पचपन', 'छप्पन', 'संतावन', 'अठावन', 'उनसठ', 'साठ',
  'इक्सठ', 'बासठ', 'तिरसठ', 'चौंसठ', 'पैंसठ', 'छियासठ', 'सरसठ', 'अड़सठ', 'उनहत्तर', 'सत्तर',
  'इकहत्तर', 'बहत्तर', 'तिहत्तर', 'चौहत्तर', 'पचहत्तर', 'छिहत्तर', 'सतहत्तर', 'अठहत्तर', 'उन्यासी', 'अस्सी',
  'इक्यासी', 'बयासी', 'तिरासी', 'चौरासी', 'पचासी', 'छियासी', 'सत्तासी', 'अट्ठासी', 'नवासी', 'नब्बे',
  'इक्यानाबे', 'बानवे', 'तिरानाबे', 'चौरानाबे', 'पचानवे', 'छियानवे', 'संतानवे', 'अट्ठानवे', 'निन्यानवे'];

 function convertTwoDigit(num) {
  return ones[num] || '';
 }

 let str = '';
 if (n >= 10000000) {
  let crore = Math.floor(n / 10000000);
  str += convertTwoDigit(crore) + ' करोड़ ';
  n %= 10000000;
 }
 if (n >= 100000) {
  let lakh = Math.floor(n / 100000);
  str += convertTwoDigit(lakh) + ' लाख ';
  n %= 100000;
 }
 if (n >= 1000) {
  let thousand = Math.floor(n / 1000);
  str += convertTwoDigit(thousand) + ' हजार ';
  n %= 1000;
 }
 if (n >= 100) {
  let hundred = Math.floor(n / 100);
  str += ones[hundred] + ' सौ ';
  n %= 100;
 }
 if (n > 0) {
  str += convertTwoDigit(n) + ' ';
 }
 return str.trim() + ' रुपये मात्र';
}

// Whitelist-only public projection. Private donor/expense/member fields never leave app_state.
function createSanitizedPublicProjection() {
 const donations = (db.donations || [])
  .filter(d => d.verified === true && d.rejected !== true && d.public_approved === true)
  .map(d => ({
   id: d.id, receipt: d.receipt, name: d.name, amount: Number(d.amount || 0), date: d.date,
   method: d.method || '', verified: true, verifiedAt: d.verifiedAt || null,
   verificationId: d.verificationId || ''
  }));
 const expenses = (db.expenses || [])
  .filter(x => x.public_approved === true)
  .map(x => ({ id: x.id, date: x.date, description: x.description, amount: Number(x.amount || 0), category: x.category || '', method: x.method || '' }));
 const works = (db.works || []).map(w => ({ name: w.name, status: w.status, progress: Math.max(0, Math.min(100, Number(w.progress || 0))) }));
 const members = (db.members || []).map(m => ({ name: m.name, role: m.role, phone: m.public_contact === true ? (m.phone || '') : '' }));
 const meetings = (db.meetings || []).filter(m => m.published === true).map(m => ({ date: m.date, place: m.place || '', decisions: m.decisions || '', next: m.next || '' }));
 const notices = (db.notices || []).filter(n => n.public_approved === true).map(n => ({ id: n.id, title: n.title, category: n.category, date: n.date, content: n.content }));
 return {
  donations, expenses, works, members, meetings, notices,
  certificates: donations.map(d => ({ id: d.id, receipt: d.receipt, name: d.name, amount: d.amount, date: d.date, verified: true, verificationId: d.verificationId })),
  settings: { temple: db.settings?.temple || 'मंदिर निर्माण समिति', place: db.settings?.place || 'बाघाकोल (बेला बिगहा)', goal: Number(db.settings?.goal || 0) }
 };
}

// Save the complete private record first, then publish only the safe projection.
async function saveNow() {
 if (!cloud) { showCloudStatus('Cloud connection उपलब्ध नहीं है।', true); return false; }
 if (!requireAdminAction()) return false;
 if (cloudSaveInProgress) { showCloudStatus('सेव प्रक्रिया पहले से चल रही है…'); return false; }
 cloudSaveInProgress = true;
 try {
  const projection = createSanitizedPublicProjection();
  // One server-side PostgreSQL RPC commits private + public state atomically.
  const { error: saveErr } = await cloud.rpc('admin_save_states', {
   _org_id: MAIN_ORG_ID,
   _private_data: db,
   _public_data: projection
  });
  if (saveErr) throw new Error('Cloud डेटा सेव नहीं हुआ: ' + saveErr.message);

  try { localStorage.setItem(ADMIN_CACHE_KEY, JSON.stringify(db)); } catch (e) {}
  showCloudStatus('✔ निजी डेटा और स्वीकृत सार्वजनिक विवरण Cloud में सेव हुए');
  return true;
 } catch (e) {
  showCloudStatus('Cloud Save Error: ' + e.message, true);
  return false;
 } finally { cloudSaveInProgress = false; }
}

function save() {
 return saveNow();
}

function showCloudStatus(msg, isError = false) {
 let el = document.getElementById('cloudStatus'); if (!el) return;
 el.textContent = msg; el.style.color = isError ? '#b83226' : '#1b6e41';
}

// UNIFIED REALTIME FETCH ENGINE - EVERY DEVICE READS MASTER PUBLIC_STATE FROM SUPABASE
async function fetchLatestCloudState() {
 if (!cloud || cloudSaveInProgress) return;
 try {
  const tableName = isAdminSession() ? 'app_state' : 'public_state';
  const { data: res, error } = await cloud.from(tableName).select('data,updated_at').eq('org_id', MAIN_ORG_ID).maybeSingle();
  if (error) throw error;
  // Never fall back from a failed public fetch to an Admin cache or in-memory private state.
  const incoming = res?.data && typeof res.data === 'object' ? res.data : emptyDb();
  const next = { ...emptyDb(), ...incoming };
  const oldStr = JSON.stringify(db), newStr = JSON.stringify(next);
  if (oldStr !== newStr) {
   db = next;
   const cacheKey = isAdminSession() ? ADMIN_CACHE_KEY : PUBLIC_CACHE_KEY;
   try { localStorage.setItem(cacheKey, JSON.stringify(db)); } catch (e) {}
   renderActiveView();
  }
  if (isAdminSession()) showCloudStatus('✔ निजी Cloud Sync सफल');
  else showCloudStatus('✔ सार्वजनिक जानकारी सिंक हुई');
 } catch (e) {
  showCloudStatus('Cloud Sync Error: ' + e.message, true);
  if (!isAdminSession()) { db = emptyDb(); try { localStorage.removeItem(PUBLIC_CACHE_KEY); } catch (_) {} renderActiveView(); }
 }
}

async function initCloud() {
 try {
  if (!window.MANDIR_CONFIG || !MANDIR_CONFIG.SUPABASE_URL || MANDIR_CONFIG.SUPABASE_URL.includes('YOUR_')) {
   document.getElementById('authMessage').textContent = 'कृपया www/config.js में अपना Supabase URL और Key दर्ज करें।';
   return;
  }
  cloud = window.supabase.createClient(MANDIR_CONFIG.SUPABASE_URL, MANDIR_CONFIG.SUPABASE_ANON_KEY);

  setInterval(fetchLatestCloudState, 10000);

  const { data: { session } } = await cloud.auth.getSession();
  if (session) await afterLogin(session.user);
  else enterPublicMode();

  cloud.auth.onAuthStateChange((event, session) => {
   if (event === 'SIGNED_OUT') {
    currentUser = null; userRole = 'public';
    enterPublicMode();
   }
  });
 } catch (e) { document.getElementById('authMessage').textContent = 'कनेक्शन नोटिस: ' + e.message; }
}

 const email = document.getElementById('authEmail').value.trim();

 if (!email || password.length < 8) return authMsg('ईमेल और कम-से-कम 8 अक्षरों का पासवर्ड भरें।');
 authMsg('अकाउंट बनाया जा रहा है…');
 const { data, error } = await cloud.auth.signUp({ email, password });
 if (error) return authMsg('साइन-अप विफल: ' + error.message);
 if (!data?.session || !data?.user) return authMsg('अकाउंट बन गया है। पहले Email Verification पूरा करें, फिर लॉगिन करें।');

function authMsg(msg) { document.getElementById('authMessage').textContent = msg; }

async function afterLogin(user) {
 currentUser = user;
 userRole = 'user';
 isPublicMode = true;
 // Fail closed: an email or editable adminEmails value never grants Admin access.
 const { data: membership, error } = await cloud.from('memberships')
  .select('role').eq('org_id', MAIN_ORG_ID).eq('user_id', user.id).maybeSingle();
 if (error) {
  currentUser = null;
  authMsg('Membership सत्यापन नहीं हो सका: ' + error.message + '. सुरक्षा के लिए Public View खोला जाएगा।');
 } else if (membership?.role === 'admin') {
  userRole = 'admin';
  isPublicMode = false;
 }
 if (isAdminSession()) {
  // Migrate legacy mixed cache only after server-side Admin membership is confirmed.
  try {
   if (!localStorage.getItem(ADMIN_CACHE_KEY)) {
    const legacy = localStorage.getItem(LEGACY_CACHE_KEY);
    if (legacy) localStorage.setItem(ADMIN_CACHE_KEY, legacy);
   }
   localStorage.removeItem(LEGACY_CACHE_KEY);
  } catch (e) {}
  document.getElementById('userRoleBadge').textContent = '👑 भूमिका: समिति एडमिन';
  loadLocalCache();
 } else {
  resetPublicMemory();
  document.getElementById('userRoleBadge').textContent = '👤 भूमिका: सामान्य दर्शक';
 }
 document.querySelectorAll('#nav button').forEach(b => b.classList.remove('hide'));
 document.getElementById('authGate').style.display = 'none';
 document.getElementById('publicBadge').classList.toggle('hide', isAdminSession());
 document.getElementById('authToggleBtn').textContent = 'Logout';
 if (!document.getElementById('cloudStatus')) {
  const el = document.createElement('span'); el.id = 'cloudStatus';
  el.style.cssText = 'font-size:11px;margin-left:10px;color:#1b6e41';
  document.querySelector('.top > div').appendChild(el);
 }
 await fetchLatestCloudState();
 page('dashboard');
}

async function enterPublicMode() {
 currentUser = null;
 userRole = 'public';
 isPublicMode = true;
 resetPublicMemory();
 document.querySelectorAll('#nav button').forEach(b => b.classList.remove('hide'));
 document.getElementById('authGate').style.display = 'none';
 document.getElementById('publicBadge').classList.remove('hide');
 document.getElementById('authToggleBtn').textContent = '🔒 लॉगिन';
 document.getElementById('userRoleBadge').textContent = '🌐 सार्वजनिक दर्शक';
 await fetchLatestCloudState();
 page('dashboard');
}

  cloud.auth.signOut();
 }
}

function page(p, pushHistory = true) {

 document.getElementById('modalBody').innerHTML = body;
 document.getElementById('modal').classList.add('show');
 try { window.history.pushState({ modal: true }, ""); } catch(e){}

 document.getElementById('modal').classList.remove('show');
 if (popHistory && window.history.state && window.history.state.modal) {
  try { window.history.back(); } catch(e){}
 }
}

function handleBackNavigation(fromHardware = false) {
 let modalEl = document.getElementById('modal');
 if (modalEl && modalEl.classList.contains('show')) {
  closeModal(false);
  return true;
 }
 let sidebarEl = document.getElementById('sidebar');
 if (sidebarEl && sidebarEl.classList.contains('open')) {
  closeSidebar();
  return true;
 }
 if (navHistory.length > 1) {
  navHistory.pop();
  let prevPage = navHistory[navHistory.length - 1] || 'dashboard';
  page(prevPage, false);
  return true;
 }
 page('dashboard', false);
 if (fromHardware) {
  if (confirm('क्या आप मंदिर प्रबंधन ऐप से बाहर निकलना चाहते हैं?')) {
   const appPlugin = window.Capacitor?.Plugins?.App;
   if (appPlugin?.exitApp) appPlugin.exitApp();
  }
 }
 return false;
}

window.addEventListener('popstate', () => handleBackNavigation(false));

function setupAndroidBackButton() {
 const appPlugin = window.Capacitor?.Plugins?.App;
 if (!appPlugin || window.__mandirBackButtonRegistered) return;
 window.__mandirBackButtonRegistered = true;
 appPlugin.addListener('backButton', () => handleBackNavigation(true));
}

document.addEventListener('deviceready', setupAndroidBackButton);

function field(label, name, type = 'text', value = '', required = false, opts = null) {
 let control = opts ? `<select name="${name}">${opts.map(o => `<option ${o === value ? 'selected' : ''}>${o}</option>`).join('')}</select>` :
  type === 'textarea' ? `<textarea name="${name}">${safe(value)}</textarea>` :
  type === 'checkbox' ? `<input name="${name}" type="checkbox" ${value ? 'checked' : ''} style="width:auto;min-height:auto">` :
  `<input name="${name}" type="${type}" value="${safe(value)}" ${required ? 'required' : ''}>`;
 return `<div class="field"><label>${label}${required ? ' *' : ''}</label>${control}</div>`;
}

function formWrap(fields, fn) {
 return `<form onsubmit="${fn}(event)"><div class="fieldgrid">${fields}</div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">रद्द करें</button><button type="submit">सेव करें</button></div></form>`;
}

async function savePublicDonation(e) {
 e.preventDefault();
 const fd = new FormData(e.target);
 const x = Object.fromEntries(fd);
 x.amount = Number(x.amount);
 if (!Number.isFinite(x.amount) || x.amount <= 0 || x.amount > 10000000) return alert('सही दान राशि दर्ज करें।');
 if (!cloud) return alert('Cloud connection उपलब्ध नहीं है।');
 try {
  const { data, error } = await cloud.functions.invoke('submit-donation', { body: {
   org_id: MAIN_ORG_ID, donor_name: String(x.name || '').trim(), amount: x.amount,
   donor_address: String(x.address || '').trim(), donor_phone: String(x.phone || '').trim(),
   donation_date: x.date || today(), payment_method: x.method || '',
   transaction_ref: String(x.ref || '').trim(), note: String(x.note || '').trim()
  }});
  if (error) throw error;
  if (!data?.id || !data?.trackingToken) throw new Error('सर्वर से सुरक्षित Tracking Token नहीं मिला।');
  let items = [];
  try { items = JSON.parse(localStorage.getItem(MY_SUBMISSIONS_KEY) || '[]'); } catch (_) {}
  items.push({ id: data.id, token: data.trackingToken, receipt: data.receipt });
  localStorage.setItem(MY_SUBMISSIONS_KEY, JSON.stringify(items));
  closeModal();
  alert(`प्रणाम ${safe(x.name)} जी! 🙏 आपकी दान प्रविष्टि सत्यापन हेतु भेज दी गई है। रसीद: ${data.receipt || '—'}\nयह अभी सत्यापित दान नहीं है।`);
  await openMySubmissions();
 } catch (err) {
  alert('दान प्रविष्टि सर्वर तक नहीं पहुँची: ' + (err.message || 'अज्ञात त्रुटि') + '\nकृपया दोबारा जाँचें।');
 }
}

async function openMySubmissions() {
 let items = [];
 try { items = JSON.parse(localStorage.getItem(MY_SUBMISSIONS_KEY) || '[]'); } catch (_) {}
 let rows = [];
 for (const item of items) {
  try {
   const { data, error } = await cloud.functions.invoke('check-donation', { body: { id: item.id, trackingToken: item.token } });
   if (error) throw error;
   const status = data?.status || 'unknown';
   const label = status === 'approved' ? '<span class="pill green">✔ स्वीकृत</span>' : status === 'rejected' ? `<span class="pill red">✖ अस्वीकृत: ${safe(data.rejection_reason || '')}</span>` : '<span class="pill orange">⌛ सत्यापन लंबित</span>';
   rows.push(`<tr><td>${safe(data?.receipt || item.receipt || '—')}</td><td>${label}</td></tr>`);

}

async function approveDonationSubmission(submissionId) {
 if (!requireAdminAction()) return;
 const sub = pendingSubmissions.find(x => x.id === submissionId);
 if (!sub) return alert('यह pending submission अब उपलब्ध नहीं है। Refresh करें।');
 let d = (db.donations || []).find(x => x.source_submission_id === sub.id);
 if (!d) {
  d = { id: id('DON'), source_submission_id: sub.id, receipt: sub.receipt || ('RCPT-' + Date.now().toString().slice(-6)),
   name: sub.donor_name, amount: Number(sub.amount), address: sub.donor_address || '', phone: sub.donor_phone || '',
   date: sub.donation_date, method: sub.payment_method || '', ref: sub.transaction_ref || '', note: sub.note || '',
   verified: true, rejected: false, public_approved: false, verifiedBy: currentUser?.email || 'Admin',
   verifiedAt: today(), verificationId: 'VER-' + Date.now().toString().slice(-6) };
  db.donations.push(d);
 }
 const saved = await saveNow();
 if (!saved) return alert('Private/Public state save failed. Submission को pending ही रहने दें; Cloud status जाँचें।');
 const { error } = await cloud.from('donation_submissions').update({ status: 'approved', donation_id: d.id, reviewed_at: new Date().toISOString() }).eq('id', sub.id);
 if (error) return alert('दान रिकॉर्ड सेव है, लेकिन Submission status update नहीं हुआ: ' + error.message);
 await fetchPendingDonationSubmissions(); donations();
 alert('दान स्वीकार और सत्यापित हो गया। Public certificate/record अलग से publish करना होगा।');
}

async function rejectDonationSubmission(submissionId) {
 if (!requireAdminAction()) return;
 const reason = prompt('अस्वीकृति का कारण लिखें:');
 if (reason === null) return;
 const { error } = await cloud.from('donation_submissions').update({ status: 'rejected', rejection_reason: reason.trim().slice(0,500), reviewed_at: new Date().toISOString() }).eq('id', submissionId);
 if (error) return alert('अस्वीकृति सेव नहीं हुई: ' + error.message);
 await fetchPendingDonationSubmissions(); donations();
}

function donationsRenderPendingOnly() { donations.__skipPendingFetch = true; donations(); donations.__skipPendingFetch = false; }

function donations() {
 const isAdmin = isAdminSession();
 if (isAdmin && cloud && !donations.__skipPendingFetch) fetchPendingDonationSubmissions().then(() => { if (document.querySelector('#nav button.active')?.dataset?.page === 'donations') donationsRenderPendingOnly(); }).catch(e => showCloudStatus('Pending sync error: ' + e.message, true));

  const actions = isAdmin ? `<button class="small ${x.public_approved ? 'success' : 'secondary'}" onclick="togglePublicApproval('${x.id}')">${x.public_approved ? '🌐 प्रकाशित' : '🔒 अप्रकाशित'}</button> <button class="small secondary" onclick="makeCert('${x.id}')">🏅 आभार पत्र</button> <button class="small danger" onclick="del('donations','${x.id}')">×</button>` : `<button class="small secondary" onclick="makeCert('${x.id}')">🏅 प्रमाणपत्र</button>`;
  return `<tr><td>${safe(x.receipt || x.id)}</td><td>${fmt(x.date)}</td><td><b>${safe(x.name)}</b>${isAdmin ? `<br><small>${safe(x.phone || '')}</small>` : ''}</td>${isAdmin ? `<td>${safe(x.address || '—')}</td>` : ''}<td>${money(x.amount)}</td><td>${safe(x.method || '—')}</td><td>${x.verified ? '<span class="pill green">✔ सत्यापित</span>' : x.rejected ? '<span class="pill red">✖ अस्वीकृत</span>' : '<span class="pill orange">लंबित</span>'}</td><td>${actions}</td></tr>`;
 }).join('');

// BULLETPROOF NATIVE SAVE & SHARE ENGINE FOR ANDROID
async function saveBase64ImageToDevice(dataUrl, filename) {
 try {
  const res = await fetch(dataUrl);
  const blob = await res.blob();
  const file = new File([blob], filename, { type: 'image/png' });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
   await navigator.share({
    files: [file],
    title: 'आभार पत्र',
    text: 'देवी मंदिर निर्माण समिति - आभार प्रमाणपत्र'
   });
   return;
  }
 } catch(err){
  console.log("Share API error: ", err);
 }

 // Fallback: Direct Blob Download Anchor
 try {
  const res = await fetch(dataUrl);
  const blob = await res.blob();
  const blobUrl = URL.createObjectURL(blob);

  let a = document.createElement('a');
  a.href = blobUrl;
  a.download = filename;
  a.target = '_blank';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  window.open(blobUrl, '_blank');
 } catch(e){
  window.open(dataUrl, '_blank');
 }
}

// Triple AI orchestration runs server-side. Never place Groq/Gemini/OpenAI keys in this APK.
async function callMandirAI(prompt, systemMsg = 'आप मंदिर निर्माण समिति के विनम्र हिंदी AI सलाहकार हैं।') {
 if (!cloud) throw new Error('Supabase Cloud कनेक्शन उपलब्ध नहीं है।');
 if (!isAdminSession()) throw new Error('AI वित्तीय सलाहकार केवल अधिकृत एडमिन लॉगिन में उपलब्ध है।');
 const { data, error } = await cloud.functions.invoke('mandir-ai', { body: {
  prompt: String(prompt || '').slice(0, 12000),
  systemMsg: String(systemMsg || '').slice(0, 3000)
 }});
 if (error) throw error;
 if (!data?.answer) throw new Error(data?.error || 'AI से उत्तर प्राप्त नहीं हुआ।');
 return data.answer;
}

function exportJSON() {
 if (!requireAdminAction()) return;
 download('devi-mandir-backup-' + today() + '.json', JSON.stringify(db, null, 2), 'application/json');
}
function exportCSV(kind) {
 if (!requireAdminAction()) return;
 if (!['donations', 'expenses'].includes(kind)) return alert('अमान्य Export प्रकार।');
 let arr = db[kind] || [], keys = kind === 'donations' ? ['receipt', 'name', 'amount', 'address', 'phone', 'date', 'method', 'ref', 'note'] : ['date', 'description', 'amount', 'category', 'paidTo', 'method', 'voucher', 'note'];
 let csv = [keys.join(','), ...arr.map(o => keys.map(k => '"' + String(o[k] ?? '').replace(/"/g, '""') + '"').join(','))].join('\n');
 download(kind + '-' + today() + '.csv', '\ufeff' + csv, 'text/csv;charset=utf-8');
}
async function importJSON() {
 if (!requireAdminAction()) return;
 const input = document.getElementById('backupFile');
 const file = input?.files?.[0];
 if (!file) return alert('पहले JSON बैकअप फाइल चुनें।');
 if (file.size > 10 * 1024 * 1024) return alert('बैकअप फाइल 10 MB से बड़ी है।');
 try {
  const parsed = JSON.parse(await file.text());
  if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('JSON object अपेक्षित है।');
  const allowedArrays = ['donations','expenses','works','members','meetings','certificates','notices'];
  for (const key of allowedArrays) if (parsed[key] !== undefined && !Array.isArray(parsed[key])) throw new Error(`'${key}' सूची होना चाहिए।`);
  if (parsed.settings !== undefined && (typeof parsed.settings !== 'object' || parsed.settings === null || Array.isArray(parsed.settings))) throw new Error('settings object अमान्य है।');
  if (!confirm('यह बैकअप मौजूदा Admin डेटा को बदल देगा। क्या आप जारी रखना चाहते हैं?')) return;
  const previous = db;
  db = { ...emptyDb(), ...parsed, settings: { ...emptyDb().settings, ...(parsed.settings || {}) } };
  if (!await save()) {
   db = previous;
   return alert('Cloud Restore पूरा नहीं हुआ। पुराने स्क्रीन डेटा को वापस रखा गया है; Cloud Status जाँचें।');
  }
  alert('JSON बैकअप Cloud में Restore हो गया।');
  page('reports');
 } catch (e) {
  alert('बैकअप Restore नहीं हुआ: ' + (e.message || 'अमान्य JSON'));
 }
}
function download(name, data, type) {
 let a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type }));
 a.download = name; a.click(); URL.revokeObjectURL(a.href);
}

async function saveSettings(e) {
 if (!requireAdminAction()) return;
 e.preventDefault();
 let x = Object.fromEntries(new FormData(e.target));
 x.goal = Number(x.goal || 0);
 db.settings = { ...db.settings, ...x };
 if (!await save()) return;
 alert('मंदिर सेटिंग्स Cloud में सेव हो गईं।'); settings();
}
