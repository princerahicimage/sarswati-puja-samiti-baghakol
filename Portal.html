}
</style>
</head>

const PUBLIC_CACHE_KEY = 'devi_mandir_public_cache_v21';
const MY_SUBMISSIONS_KEY = 'devi_mandir_my_submissions_v11';
const DEFAULT_DB = Object.freeze({
 donations: [], expenses: [], works: [], members: [], meetings: [], certificates: [], notices: [],
 settings: { temple: 'सरस्वती पूजा समिति', place: 'बाघाकोल (बेला बिगहा)', president: '', secretary: '', treasurer: '', phone: '', address: '', goal: 500000 }

 try {

 db = emptyDb();

  'इक्यावन', 'बावन', 'तिरेपन', 'चौवन', 'पचपन', 'छप्पन', 'सत्तावन', 'अट्ठावन', 'उनसठ', 'साठ',
  'इकसठ', 'बासठ', 'तिरसठ', 'चौंसठ', 'पैंसठ', 'छियासठ', 'सरसठ', 'अड़सठ', 'उनहत्तर', 'सत्तर',
  'इकहत्तर', 'बहत्तर', 'तिहत्तर', 'चौहत्तर', 'पचहत्तर', 'छिहत्तर', 'सतहत्तर', 'अठहत्तर', 'उन्नासी', 'अस्सी',
  'इक्यासी', 'बयासी', 'तिरासी', 'चौरासी', 'पचासी', 'छियासी', 'सत्तासी', 'अट्ठासी', 'नवासी', 'नब्बे',
  'इक्यानवे', 'बानवे', 'तिरानवे', 'चौरानवे', 'पंचानवे', 'छियानवे', 'सत्तानवे', 'अट्ठानवे', 'निन्यानवे'];

 function convertTwoDigit(num) { return ones[num] || ''; }
 let str = '';
 if (n >= 10000000) { str += convertTwoDigit(Math.floor(n / 10000000)) + ' करोड़ '; n %= 10000000; }
 if (n >= 100000) { str += convertTwoDigit(Math.floor(n / 100000)) + ' लाख '; n %= 100000; }
 if (n >= 1000) { str += convertTwoDigit(Math.floor(n / 1000)) + ' हजार '; n %= 1000; }
 if (n >= 100) { str += ones[Math.floor(n / 100)] + ' सौ '; n %= 100; }
 if (n > 0) { str += convertTwoDigit(n) + ' '; }
 return str.trim() + ' रुपये मात्र';
}

function createSanitizedPublicProjection() {
 const donations = (db.donations || [])
  .filter(d => d.verified === true && d.rejected !== true && d.public_approved === true)
  .map(d => ({
   id: d.id, receipt: d.receipt, name: d.name, amount: Number(d.amount || 0), date: d.date,
   method: d.method || '', verified: true, verifiedAt: d.verifiedAt || null,
   verificationId: d.verificationId || ''
  }));
 const expenses = (db.expenses || [])
  .filter(x => x.public_approved === true)
  .map(x => ({ id: x.id, date: x.date, description: x.description, amount: Number(x.amount || 0), category: x.category || '', method: x.method || '' }));
 const works = (db.works || []).map(w => ({ name: w.name, status: w.status, progress: Math.max(0, Math.min(100, Number(w.progress || 0))) }));
 const members = (db.members || []).map(m => ({ name: m.name, role: m.role, phone: m.public_contact === true ? (m.phone || '') : '' }));
 const meetings = (db.meetings || []).filter(m => m.published === true).map(m => ({ date: m.date, place: m.place || '', decisions: m.decisions || '', next: m.next || '' }));
 const notices = (db.notices || []).filter(n => n.public_approved === true).map(n => ({ id: n.id, title: n.title, category: n.category, date: n.date, content: n.content }));
 return {
  donations, expenses, works, members, meetings, notices,
  certificates: donations.map(d => ({ id: d.id, receipt: d.receipt, name: d.name, amount: d.amount, date: d.date, verified: true, verificationId: d.verificationId })),
  settings: { temple: db.settings?.temple || 'सरस्वती पूजा समिति', place: db.settings?.place || 'बाघाकोल (बेला बिगहा)', goal: Number(db.settings?.goal || 0) }
 };
}

async function saveNow() {
 if (!cloud) return false;
 if (!requireAdminAction()) return false;
 if (cloudSaveInProgress) return false;
 cloudSaveInProgress = true;
 try {
  const projection = createSanitizedPublicProjection();
  const { error: saveErr } = await cloud.rpc('admin_save_states', {
   _org_id: MAIN_ORG_ID,
   _private_data: db,
   _public_data: projection
  });
  if (saveErr) throw new Error(saveErr.message);
  try { localStorage.setItem(ADMIN_CACHE_KEY, JSON.stringify(db)); } catch (e) {}
  return true;
 } catch (e) {
  alert('Cloud Save Error: ' + e.message);
  return false;
 } finally { cloudSaveInProgress = false; }
}

async function fetchLatestCloudState() {
 if (!cloud || cloudSaveInProgress) return;
 try {
  const tableName = isAdminSession() ? 'app_state' : 'public_state';
  const { data: res, error } = await cloud.from(tableName).select('data,updated_at').eq('org_id', MAIN_ORG_ID).maybeSingle();
  if (error) throw error;
  const incoming = res?.data && typeof res.data === 'object' ? res.data : emptyDb();
  db = { ...emptyDb(), ...incoming };
  renderActiveView();
 } catch (e) {}
}

function renderActiveView() {
 let modalEl = document.getElementById('modal');
 if (!modalEl || !modalEl.classList.contains('show')) {
  let activePage = document.querySelector('#nav button.active')?.dataset?.page || 'dashboard';
  page(activePage, false);
 }
}

async function initCloud() {
 try {
  if (!window.MANDIR_CONFIG || !MANDIR_CONFIG.SUPABASE_URL) return;
  cloud = window.supabase.createClient(MANDIR_CONFIG.SUPABASE_URL, MANDIR_CONFIG.SUPABASE_ANON_KEY);
  setInterval(fetchLatestCloudState, 10000);
  const { data: { session } } = await cloud.auth.getSession();
  if (session) await afterLogin(session.user);
  else enterPublicMode();
 } catch (e) {}
}

async function signInCloud() {
 const email = document.getElementById('authEmail').value.trim(), password = document.getElementById('authPassword').value;
 if (!email || !password) return alert('ईमेल और पासवर्ड भरें।');
 const { data, error } = await cloud.auth.signInWithPassword({ email, password });
 if (error) return alert('लॉगिन विफल: ' + error.message);
 isPublicMode = false;
 await afterLogin(data.user);
}

async function afterLogin(user) {
 currentUser = user;
 userRole = 'user';
 isPublicMode = true;
 const { data: membership } = await cloud.from('memberships').select('role').eq('org_id', MAIN_ORG_ID).eq('user_id', user.id).maybeSingle();
 if (membership?.role === 'admin') {
  userRole = 'admin';
  isPublicMode = false;
 }
 document.getElementById('authGate').style.display = 'none';
 document.getElementById('publicBadge').classList.toggle('hide', isAdminSession());
 document.getElementById('authToggleBtn').textContent = 'लॉगआउट';
 loadLocalCache();
 await fetchLatestCloudState();
 page('dashboard');
}

async function enterPublicMode() {
 currentUser = null;
 userRole = 'public';
 isPublicMode = true;
 resetPublicMemory();
 document.getElementById('authGate').style.display = 'none';
 document.getElementById('publicBadge').classList.remove('hide');
 document.getElementById('authToggleBtn').textContent = 'लॉगिन';
 await fetchLatestCloudState();
 page('dashboard');
}

function handleAuthToggle() {
 if (isPublicMode || !currentUser) {
  document.getElementById('authGate').style.display = 'flex';
 } else {
  cloud.auth.signOut();
  enterPublicMode();
 }
}

let navHistory = ['dashboard'];

function page(p, pushHistory = true) {
 document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.page === p));
 document.getElementById('topTitle').textContent = titles[p] || 'डैशबोर्ड';
 closeSidebar();
 const views = { dashboard, donations, certificates, expenses, construction, committee, meetings, community, reports, settings };
 (views[p] || dashboard)();
}

document.getElementById('nav').addEventListener('click', e => {
 let b = e.target.closest('button[data-page]');
 if (b) page(b.dataset.page);
});

function openModal(title, body) {
 document.getElementById('modalTitle').textContent = title;
 document.getElementById('modalBody').innerHTML = body;
 document.getElementById('modal').classList.add('show');
}

function closeModal() {
 document.getElementById('modal').classList.remove('show');
}

function stat(label, value, sub, ico) {
 return `<div class="stat"><span class="ico">${ico}</span><label>${label}</label><h2>${value}</h2><small>${sub}</small></div>`;
}

function table(headers, rows, empty = 'कोई रिकॉर्ड उपलब्ध नहीं है।') {
 return `<div class="tablewrap"><table><thead><tr>${headers.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows || `<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`;
}

function dashboard() {
 let verifiedDonations = (db.donations || []).filter(d => d.verified && !d.rejected);
 let inc = totalVerified(db.donations, 'amount'), out = total(db.expenses, 'amount'), bal = inc - out;
 let goal = Number(db.settings?.goal || 500000), pct = goal ? Math.min(100, Math.round(inc / goal * 100)) : 0;
 let recent = [...(db.donations || [])].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);

 document.getElementById('view').innerHTML = `
 <div class="banner-card">
  <img src="assets/samiti_logo.png" onerror="this.onerror=null;this.style.display='none';">
  <div>
   <h2>${safe(db.settings?.temple || 'सरस्वती पूजा समिति')}</h2>
   <p>स्थान: ${safe(db.settings?.place || 'बाघाकोल (बेला बिगहा)')} • Cloud पारदर्शी रजिस्टर</p>
  </div>
 </div>
 <div class="grid">
   ${stat('कुल प्राप्त चंदा', money(inc), verifiedDonations.length + ' कुल सत्यापित दानकर्ता', '🙏')}
   ${stat('कुल निर्माण व्यय', money(out), (db.expenses || []).length + ' खर्च प्रविष्टियाँ', '₹')}
   ${stat('उपलब्ध बैलेंस', money(bal), 'प्राप्ति − व्यय', '💰')}
   ${stat('सत्यापित दानदाता', verifiedDonations.length, 'स्वीकृत रिकॉर्ड', '👥')}
  </div>
  <div class="sectiongrid">
   <div class="panel">
    <h3>लक्ष्य प्राप्ति प्रगति</h3>
    <div style="display:flex;justify-content:space-between;margin:16px 0 8px"><b>${pct}% पूर्ण</b><span class="muted">${goal ? money(goal) + ' लक्ष्य' : ''}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
   </div>
   <div class="panel">
    <h3>हाल में प्राप्त सहयोग</h3>
    ${table(['दिनांक', 'दानदाता', 'राशि', 'स्थिति'], recent.map(x => `
     <tr>
      <td>${fmt(x.date)}</td>
      <td><b>${safe(x.name)}</b></td>
      <td><b>${money(x.amount)}</b></td>
      <td>${x.verified ? '<span class="pill green">✔ सत्यापित</span>' : '<span class="pill orange">⌛ लंबित</span>'}</td>
     </tr>`).join(''))}
   </div>
  </div>`;
}

  <tr>
   <td>${safe(x.receipt || x.id)}</td>
   <td>${fmt(x.date)}</td>

function makeCert(did) {
 const d = (db.donations || []).find(x => x.id === did);
 if (!d) return;
 const certHtml = `
 <div class="cert-preview-container">
  <div class="cert-preview" id="certificate">
   <img src="assets/samiti_logo.png" class="header-logo" alt="समिति लोगो">
   <h2>${safe(db.settings?.temple || 'सरस्वती पूजा समिति')}</h2>
   <div class="location">${safe(db.settings?.place || 'बाघाकोल (बेला बिगहा)')}</div>
   <div class="divider"></div>
   <div class="certtitle">आभार एवं प्रशंसा पत्र</div>

    <div><b>अध्यक्ष</b></div>

   </div>
  </div>
 </div>`;
 openModal('आभार एवं प्रशंसा पत्र', certHtml + `<button style="margin-top:14px" onclick="window.print()">🖨 प्रिंट करें</button>`);
}
